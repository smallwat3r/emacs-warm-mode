name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs: ['27.2', '29.4', '30.1']
    steps:
      - uses: actions/checkout@v4
      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs }}
      - name: Byte-compile
        run: emacs -Q --batch --eval '(setq byte-compile-error-on-warn t)' -f batch-byte-compile warm-mode.el
      - name: Test
        run: emacs -Q --batch -l warm-mode.el -l warm-mode-test.el -f ert-run-tests-batch-and-exit
      - name: Checkdoc
        run: |
          emacs -Q --batch --eval '(progn
            (checkdoc-file "warm-mode.el")
            (with-current-buffer (get-buffer-create checkdoc-diagnostic-buffer)
              (unless (zerop (buffer-size))
                (princ (buffer-string))
                (kill-emacs 1))))'
      - name: Package-lint
        run: |
          emacs -Q --batch --eval '(progn
            (require (quote package))
            (push (cons "melpa" "https://melpa.org/packages/") package-archives)
            (package-initialize)
            (package-refresh-contents)
            (package-install (quote package-lint)))'
          emacs -Q --batch --eval '(progn (require (quote package)) (package-initialize))' \
            -f package-lint-batch-and-exit warm-mode.el
